<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Path for Wisdom</title>

    <!-- PWA: installable, offline-capable -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1b1730" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Path of Wisdom" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0e0e1a;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* DOM text input overlay used by the avatar-creation scene */
      #name-input {
        position: absolute;
        display: none;
        font-size: 22px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 3px solid #f4d35e;
        background: #fffbe8;
        color: #3a2e1f;
        text-align: center;
        outline: none;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <input id="name-input" type="text" maxlength="12" autocomplete="off" />
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("SW registration failed", e));
        });
      }
    </script>
  </body>
</html>
